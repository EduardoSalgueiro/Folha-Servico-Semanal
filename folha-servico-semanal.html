<style>
  :root{
    --forest:#3F6029; --forest-light:#537B37; --sage:#8FBA4E;
    --gold:#D58D27; --rust:#A6432B; --bg:#FAF9F5; --card:#FFFFFF;
    --line:#E4E1D6; --text:#1E241D; --text-mute:#6B7264;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif; -webkit-font-smoothing:antialiased; padding-bottom:90px;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  header{background:var(--forest); color:#F3F1E8; padding:16px 18px 18px; display:flex; align-items:center; gap:12px;}
  header img{width:38px; height:38px; object-fit:contain; background:#fff; border-radius:8px; padding:3px; flex-shrink:0;}
  header h1{font-size:16px; margin:0 0 2px; font-weight:600;}
  header p{margin:0; font-size:11.5px; color:#C7CCB8;}

  .tabs{display:flex; background:var(--forest-light); border-bottom:1px solid #4A5B4B;}
  .tabs button{flex:1; background:none; border:none; color:#C7CCB8; padding:12px 4px; font-size:13px; font-weight:500; font-family:inherit; border-bottom:2px solid transparent;}
  .tabs button.active{color:#fff; border-bottom-color:var(--gold);}

  main{padding:16px; max-width:520px; margin:0 auto;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.4px; color:var(--text-mute); margin-bottom:5px;}
  .field input, .field select{
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:8px;
    font-size:15px; font-family:inherit; background:#fff; color:var(--text);
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--sage);}
  .row2{display:flex; gap:10px;}
  .row2 > .field{flex:1;}

  .date-overlay-wrap{position:relative;}
  .date-overlay{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    display:flex; align-items:center;
    padding:11px 12px; border:1.5px solid transparent; border-radius:8px;
    font-size:15px; font-family:inherit; background:#fff; color:var(--text);
  }

  .toggle{display:flex; gap:8px; margin-bottom:14px;}
  .toggle button{
    flex:1; padding:11px; border-radius:8px; border:1.5px solid var(--line); background:#fff;
    font-size:13.5px; font-weight:600; color:var(--text-mute); font-family:inherit;
  }
  .toggle button.active.com{border-color:var(--sage); background:#EEF1E8; color:var(--forest);}
  .toggle button.active.sem{border-color:var(--gold); background:#FBF3DD; color:#8A6D14;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px;}
  .card h3{margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.4px; color:var(--forest);}

  .btn-add{
    width:100%; padding:13px; border-radius:9px; border:none; background:var(--forest); color:#fff;
    font-size:14.5px; font-weight:600; font-family:inherit;
  }
  .btn-add:active{background:var(--forest-light);}

  .entry{
    background:#fff; border:1px solid var(--line); border-left:3px solid var(--sage); border-radius:8px;
    padding:12px 14px; margin-bottom:10px;
  }
  .entry.sem{border-left-color:var(--gold);}
  .entry .top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;}
  .entry .serv{font-weight:600; font-size:14px;}
  .entry .meta{font-size:12px; color:var(--text-mute);}
  .entry .obs{font-size:12.5px; color:var(--text-mute); margin-top:5px; font-style:italic;}
  .entry .actions{display:flex; justify-content:space-between; margin-top:6px;}
  .entry .del{background:none; border:none; color:var(--rust); font-size:16px; padding:4px 8px; font-family:inherit;}
  .entry .edit{background:none; border:none; color:var(--forest); font-size:15px; padding:4px 8px; font-family:inherit;}

  .empty-list{text-align:center; padding:30px 10px; color:var(--text-mute); font-size:13px; border:1.5px dashed var(--line); border-radius:10px;}

  .day-card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px;}
  .day-card.ok{border-left:3px solid var(--sage);}
  .day-card.warn{border-left:3px solid var(--rust);}
  .day-card .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .day-card .dname{font-weight:600; font-size:13.5px;}
  .day-card .badge{font-size:11px; font-weight:600; padding:3px 9px; border-radius:12px;}
  .day-card .badge.ok{background:#EEF1E8; color:var(--forest);}
  .day-card .badge.warn{background:#F7E7E2; color:var(--rust);}
  .day-card ul{margin:0; padding-left:18px; font-size:12.5px; color:var(--text-mute);}
  .day-card li{margin-bottom:2px;}

  .footer-bar{
    position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line);
    padding:12px 16px; display:flex; gap:10px; max-width:520px; margin:0 auto;
  }
  .footer-bar button{
    flex:1; padding:14px; border-radius:9px; border:none; font-size:13.5px; font-weight:600; font-family:inherit;
  }
  .btn-save{background:#fff; border:1.5px solid var(--line) !important; color:var(--text-mute);}
  .btn-send{background:var(--gold); color:#3A2E08;}
  .btn-send:active{background:#b8791f;}

  .saved-week{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px;}
  .saved-week .hd{display:flex; justify-content:space-between; font-weight:600; font-size:14px; margin-bottom:6px;}
  .saved-week .hd span.mono{color:var(--forest);}
  .saved-week .stat{font-size:12px; color:var(--text-mute);}

  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%); background:var(--forest); color:#fff;
    padding:10px 18px; border-radius:14px; font-size:13px; opacity:0; transition:opacity .25s; z-index:50;
    max-width:90%; text-align:center; white-space:normal;
  }
  .toast.show{opacity:1;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(30,36,29,.55); display:none;
    align-items:center; justify-content:center; z-index:60; padding:20px;
  }
  .modal-box{background:#fff; border-radius:14px; padding:20px; max-width:380px; width:100%;}
  .modal-box p{margin:0 0 18px; font-size:14px; color:var(--text); white-space:pre-line; line-height:1.5;}
  .modal-box .actions{display:flex; gap:10px;}
  .modal-box button{flex:1; padding:12px; border-radius:9px; border:none; font-size:13.5px; font-weight:600; font-family:inherit;}
  .modal-box .btn-cancel{background:#fff; border:1.5px solid var(--line); color:var(--text-mute);}
  .modal-box .btn-confirm{background:var(--rust); color:#fff;}

  .picker-btn{
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:8px;
    font-size:15px; font-family:inherit; background:#fff; color:var(--text); text-align:left;
    user-select:none; -webkit-user-select:none;
  }
  .picker-btn:disabled{background:var(--bg); color:var(--text-mute); opacity:.75;}
  #pickerModal .modal-box{max-height:80vh; display:flex; flex-direction:column;}
  #pickerModalTitle{margin:0 0 12px; font-size:15px; font-weight:600; color:var(--forest);}
  #pickerModalList{display:flex; flex-direction:column; gap:8px; overflow-y:auto; margin-bottom:14px;}
  #pickerModalList button{
    padding:12px; border-radius:8px; border:1.5px solid var(--line); background:#fff;
    text-align:left; font-family:inherit; font-size:14px; color:var(--text); flex:none;
    user-select:none; -webkit-user-select:none;
  }
</style>
</head>

<script>
const NOMES = ['Figueira','Serrado','Pedro Figueira','Rui Ribeiro','Cornel','Vânia','Natália'];
// Colaboradores que só podem lançar serviços "Sem folha" (a opção "Com folha" fica escondida).
const NOMES_SO_SEM_FOLHA = ['Vânia','Natália'];
const COM_FOLHA = ['Poda','Topping','Baixeiras','Trat. Foliar','Erva','Rama','Herbicida','Adubo/Mat. Org.','Raticida','Burricos','Colheita','Colheita Carrego'];
const SEM_FOLHA = ['Cons. e Rep. Parcelas/Caminhos','Cons. e Rep. Equipamentos/Máquinas','Rega e Manut. Rega e Control de Adubos','Deslocações','Vacas','Outros (Agricultura)','Contagens de Armadilhas','Monte/Casa Moura','Casas','Outros'];
// Serviços que, por si só, obrigam a descrever em Observações (independente do local)
const SERVICOS_OBS_OBRIGATORIA = ['Trat. Foliar','Herbicida','Outros (Agricultura)','Outros','Deslocações'];

// "Com folha" usa sempre a mesma lista de locais, qualquer que seja o serviço.
const LOCAIS_COM = ['Manantiz','Bico','Ent. Drtª','Ent. Esqdª','24 Horas','Frente Monte','Trás do Monte','Poço','Várzea','Charnequinha','Charnequinha Nova Plantação'];

// "Sem folha" tem uma lista de locais própria por serviço.
const LOCAIS_SEM_POR_SERVICO = {
  'Cons. e Rep. Parcelas/Caminhos': ['Sampaio','Charnequinha'],
  'Cons. e Rep. Equipamentos/Máquinas': ['Sampaio','Charnequinha'],
  'Rega e Manut. Rega e Control de Adubos': ['Sampaio','Charnequinha'],
  'Deslocações': ['Moura','Sampaio','Charnequinha','Outro'],
  'Vacas': ['Sampaio','Charnequinha'],
  'Outros (Agricultura)': ['Sampaio','Charnequinha'],
  'Contagens de Armadilhas': ['Sampaio','Charnequinha'],
  'Monte/Casa Moura': ['Moura','Sampaio','Charnequinha','Outro'],
  'Casas': ['Rua do Forno','Rua Santana e Costa','Av Carmo 49','Av Carmo 51','Terreno Salúquia','Outro'],
  'Outros': ['Outro']
};

// Equipamentos/Máquinas: seleção em cascata (categoria → item específico).
const EQUIPAMENTOS = {
  'Tratores': ['Valtra','Jonh Deere','Jonh Deere Novo','Landini','New Holland PH','New Holland NT'],
  'Maq. Tratamento': ['Atomizador','Pulverizador','Barra Herbicida'],
  'Manuais': ['Pellenks','Roçadoras','Motoserras','Varejadores','Tesouras Poda','Serras Elétricas'],
  'Motos': ['Moto 4 Azul','Moto 4 Laranja','Moto 4 Vermelha'],
  'Reboques': ['Cigarrão','Relouttes','Gallera','Atrelado'],
  'Automóveis': ['L300','Opel','Fuso','Peugeot','Ford'],
  'Alfaias': ['Destroçador Rama','Destroçador Erva','Espalhador Adubo','Grade Amaricana','Rodo','Cilindro'],
  'Colheita': ['Vibrador Traseiro','Maquina Colheita'],
  'Outros': ['Retro','Outro']
};

// Janela de escolha genérica, usada por todos os campos de seleção da app
// (Nome, Serviço, Local, Equipamento) — evita o seletor nativo do telemóvel
// e dá-nos controlo total sobre o aspeto e os botões.
function abrirPicker(titulo, opcoes, aoEscolher){
  document.getElementById('pickerModalTitle').textContent = titulo;
  const lista = document.getElementById('pickerModalList');
  lista.innerHTML = opcoes.map(o => `<button type="button" data-v="${esc(o)}">${esc(o)}</button>`).join('');
  lista.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    fecharPicker();
    aoEscolher(btn.dataset.v);
  }));
  document.getElementById('pickerModal').style.display = 'flex';
}
function fecharPicker(){
  document.getElementById('pickerModal').style.display = 'none';
}
document.getElementById('pickerModalCancel').addEventListener('click', fecharPicker);

let tipo = 'com';
let entries = [];

// Guarda os dados no próprio telemóvel/browser (não depende de login nem do Claude).
const storage = {
  async get(key){
    const v = localStorage.getItem(key);
    return v !== null ? { value: v } : null;
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return true;
  },
  async list(prefix){
    const keys = [];
    for(let i=0; i<localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(prefix)) keys.push(k);
    }
    return { keys };
  }
};

function getISOWeekString(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1)/7);
  return `${date.getUTCFullYear()}-W${String(weekNo).padStart(2,'0')}`;
}
function semanaParaDatas(weekStr){
  const [y,w] = weekStr.split('-W').map(Number);
  const simple = new Date(Date.UTC(y,0,1 + (w-1)*7));
  const dow = simple.getUTCDay() || 7;
  const monday = new Date(simple); monday.setUTCDate(simple.getUTCDate() - dow + 1);
  const sunday = new Date(monday); sunday.setUTCDate(monday.getUTCDate() + 6);
  return { monday, sunday };
}
function weekStringToRange(weekStr){
  if(!weekStr) return null;
  const { monday, sunday } = semanaParaDatas(weekStr);
  const fmt = d => d.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit',timeZone:'UTC'});
  return `${fmt(monday)} a ${fmt(sunday)} (Segunda a Domingo)`;
}

// Prazo para lançar serviços de uma semana: dias corridos depois do Domingo
// (fim da semana) até onde ainda é permitido adicionar/editar. Ajustável
// pelo Eduardo — 2 = até terça-feira da semana seguinte.
const DIAS_PRAZO_LANCAMENTO = 2;
function semanaDentroDoPrazo(weekStr){
  if(!weekStr) return true;
  const { sunday } = semanaParaDatas(weekStr);
  const prazo = new Date(sunday);
  prazo.setUTCDate(prazo.getUTCDate() + DIAS_PRAZO_LANCAMENTO);
  prazo.setUTCHours(23,59,59,999);
  return new Date() <= prazo;
}
function renderSemanaRange(){
  const semana = document.getElementById('semana').value;
  document.getElementById('semanaDateOverlay').textContent = weekStringToRange(semana) || '';
}
function slugKey(str){
  return String(str).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase();
}
function syncSemana(){
  const dv = document.getElementById('semanaDate').value;
  document.getElementById('semana').value = dv ? getISOWeekString(new Date(dv+'T00:00:00')) : '';
  renderSemanaRange();
  tryLoadDraft();
}
document.getElementById('semanaDate').valueAsDate = new Date();
document.getElementById('semanaDate').addEventListener('change', syncSemana);
syncSemana();

async function tryLoadDraft(){
  const nome = document.getElementById('nome').value;
  const semana = document.getElementById('semana').value;
  if(!nome || !semana) return;

  // Muda sempre para o estado da semana/colaborador selecionados — sem isto,
  // trocar de semana com o Nome bloqueado deixava ficar em ecrã os dados da
  // semana anterior, em vez de mostrar a nova (vazia ou com o seu rascunho).
  entries = [];
  renderEntries();
  lockNome();

  const key = `folha:${slugKey(semana)}:${slugKey(nome)}`;
  try{
    const r = await storage.get(key);
    if(r && r.value){
      const payload = JSON.parse(r.value);
      if(payload.entries && payload.entries.length){
        entries = payload.entries;
        renderEntries();
        lockNome();
        showToast('Rascunho desta semana carregado');
      }
    }
  }catch(err){ /* sem rascunho guardado — segue vazio */ }
}

// Bloqueio de colaborador por aparelho: a primeira escolha feita neste
// telemóvel fica gravada permanentemente — reabrir o link mais tarde (mesmo
// noutro dia/semana) já não mostra a opção de escolher outro colaborador.
const DEVICE_NOME_KEY = 'dispositivo:colaborador';
let dispositivoBloqueado = false;

// Alguns colaboradores só têm acesso a "Sem folha" — esconde a opção "Com folha".
function aplicarRestricaoTipoPorNome(nome){
  const restrito = NOMES_SO_SEM_FOLHA.includes(nome);
  document.getElementById('btnCom').style.display = restrito ? 'none' : 'block';
  if(restrito && tipo === 'com'){ setTipo('sem'); }
}

async function aoMudarNome(valor){
  document.getElementById('nome').value = valor;
  document.getElementById('nomePickerBtn').textContent = valor;
  aplicarRestricaoTipoPorNome(valor);
  if(valor && !dispositivoBloqueado){
    dispositivoBloqueado = true;
    try{ await storage.set(DEVICE_NOME_KEY, valor); }catch(err){}
  }
  tryLoadDraft();
}
document.getElementById('nomePickerBtn').addEventListener('click', () => {
  if(document.getElementById('nomePickerBtn').disabled) return;
  abrirPicker('Seleciona o teu nome', NOMES, aoMudarNome);
});

(async function aplicarBloqueioDispositivo(){
  try{
    const r = await storage.get(DEVICE_NOME_KEY);
    if(r && r.value){
      dispositivoBloqueado = true;
      document.getElementById('nome').value = r.value;
      document.getElementById('nomePickerBtn').textContent = r.value;
      aplicarRestricaoTipoPorNome(r.value);
      lockNome();
      tryLoadDraft();
    }
  }catch(err){ /* sem colaborador gravado neste aparelho ainda */ }
})();

function populateServico(){
  document.getElementById('servico').value = '';
  document.getElementById('servicoPickerBtn').textContent = 'Seleciona o serviço';
  document.getElementById('labelServico').textContent = tipo==='com' ? 'Serviço (com folha)' : 'Serviço (sem folha)';
  populateLocais();
  toggleEquipamento();
}
document.getElementById('servicoPickerBtn').addEventListener('click', () => {
  const lista = tipo === 'com' ? COM_FOLHA : SEM_FOLHA;
  abrirPicker('Seleciona o serviço', lista, aoMudarServico);
});
function aoMudarServico(valor){
  document.getElementById('servico').value = valor;
  document.getElementById('servicoPickerBtn').textContent = valor;
  populateLocais();
  toggleEquipamento();
}

function populateLocais(){
  document.getElementById('local').value = '';
  document.getElementById('localPickerBtn').textContent = 'Seleciona o local';
}
document.getElementById('localPickerBtn').addEventListener('click', () => {
  const servicoAtual = document.getElementById('servico').value;
  const lista = tipo === 'com' ? LOCAIS_COM : (LOCAIS_SEM_POR_SERVICO[servicoAtual] || []);
  if(lista.length === 0){ showToast('Escolhe primeiro o serviço'); return; }
  abrirPicker('Seleciona o local', lista, (valor) => {
    document.getElementById('local').value = valor;
    document.getElementById('localPickerBtn').textContent = valor;
  });
});

function servicoEhEquipamentos(){
  return tipo === 'sem' && document.getElementById('servico').value === 'Cons. e Rep. Equipamentos/Máquinas';
}
function toggleEquipamento(){
  const mostrar = servicoEhEquipamentos();
  document.getElementById('equipWrap').style.display = mostrar ? 'block' : 'none';
  if(!mostrar) limparEquipamentoSelecionado();
}
function limparEquipamentoSelecionado(){
  document.getElementById('equipItem').value = '';
  document.getElementById('equipPickerBtn').textContent = 'Toca para escolher o equipamento';
}
// Seletor de equipamento em dois passos, dentro da mesma janela genérica:
// toca no campo → escolhe a categoria (só para filtrar, nunca é guardada) →
// escolhe o equipamento dessa categoria.
document.getElementById('equipPickerBtn').addEventListener('click', () => {
  abrirPicker('Escolhe a categoria', Object.keys(EQUIPAMENTOS), (categoria) => {
    abrirPicker(categoria, EQUIPAMENTOS[categoria], (item) => {
      document.getElementById('equipItem').value = item;
      document.getElementById('equipPickerBtn').textContent = item;
    });
  });
});

document.getElementById('btnCom').addEventListener('click', () => setTipo('com'));
document.getElementById('btnSem').addEventListener('click', () => setTipo('sem'));
function setTipo(t){
  tipo = t;
  document.getElementById('btnCom').classList.toggle('active', t==='com');
  document.getElementById('btnSem').classList.toggle('active', t==='sem');
  populateServico();
}

populateServico();

document.getElementById('btnAdd').addEventListener('click', () => {
  const nome = document.getElementById('nome').value;
  const data = document.getElementById('data').value;
  const horaIni = document.getElementById('horaIni').value;
  const horaFim = document.getElementById('horaFim').value;
  const extras = document.getElementById('extras').value;
  const servicoSel = document.getElementById('servico').value;
  const local = document.getElementById('local').value;
  const equipItem = document.getElementById('equipItem').value;
  const obs = document.getElementById('obs').value.trim();
  const semana = document.getElementById('semana').value;
  const ehEquipamentos = servicoEhEquipamentos();

  if(!nome){ showToast('Seleciona o colaborador'); return; }
  if(!semanaDentroDoPrazo(semana)){ showToast('O prazo para lançar serviços desta semana já terminou'); return; }
  if(!data){ showToast('Indica a data'); return; }
  if(!horaIni || !horaFim){ showToast('Indica as horas'); return; }
  if(!horaValida(horaIni) || !horaValida(horaFim)){ showToast('Hora inválida — usa o formato 08:00'); return; }
  const conflito = entradaSobreposta(data, horaIni, horaFim);
  if(conflito){ showToast(`Sobreposto com "${conflito.servico}" (${conflito.horaIni}–${conflito.horaFim}) nesse dia`); return; }
  if(!servicoSel){ showToast('Seleciona o serviço'); return; }
  if(!local){ showToast('Seleciona o local'); return; }
  if(ehEquipamentos){
    if(!equipItem){ showToast('Seleciona o equipamento'); return; }
    if(equipItem === 'Outro' && !obs){ showToast('Descreve o equipamento em Observações'); return; }
  }
  if(local === 'Outro' && !obs){ showToast('Descreve o local em Observações'); return; }
  if(SERVICOS_OBS_OBRIGATORIA.includes(servicoSel) && !obs){ showToast(`"${servicoSel}" obriga a descrever em Observações`); return; }

  entries.push({
    tipo, data, horaIni, horaFim, extras: extras || '0',
    servico: servicoSel,
    local,
    equipamento: ehEquipamentos ? equipItem : '',
    obs
  });

  ['data','horaIni','horaFim','extras','obs'].forEach(id => document.getElementById(id).value = '');
  populateServico();
  renderEntries();
  lockNome();
  autoSaveDraft();
  showToast('Serviço adicionado');
});

async function autoSaveDraft(){
  const nome = document.getElementById('nome').value;
  const semana = document.getElementById('semana').value;
  if(!nome || !semana || entries.length===0) return;
  const key = `folha:${slugKey(semana)}:${slugKey(nome)}`;
  try{
    await storage.set(key, JSON.stringify({nome, semana, entries, guardadoEm: new Date().toISOString()}));
  }catch(err){ /* falha silenciosa; o botão Guardar continua disponível como reforço */ }
}

function lockNome(){
  document.getElementById('nomePickerBtn').disabled = dispositivoBloqueado || entries.length > 0;
}

function horasEntre(ini,fim){
  const [h1,m1]=ini.split(':').map(Number), [h2,m2]=fim.split(':').map(Number);
  let diff = (h2*60+m2 - (h1*60+m1))/60; if(diff<0) diff+=24;
  return diff;
}

// Um colaborador não pode estar em dois serviços ao mesmo tempo — verifica se
// [ini,fim) se sobrepõe a algum outro serviço já lançado no mesmo dia.
function horaParaMinutos(h){
  const [hh,mm] = h.split(':').map(Number);
  return hh*60+mm;
}
function horariosSobrepoem(iniA,fimA,iniB,fimB){
  let a1 = horaParaMinutos(iniA), a2 = horaParaMinutos(fimA);
  let b1 = horaParaMinutos(iniB), b2 = horaParaMinutos(fimB);
  if(a2 <= a1) a2 += 24*60;
  if(b2 <= b1) b2 += 24*60;
  return a1 < b2 && b1 < a2;
}
function entradaSobreposta(data, horaIni, horaFim){
  return entries.find(e => e.data === data && horariosSobrepoem(horaIni, horaFim, e.horaIni, e.horaFim));
}

// Campo de hora simples (teclado numérico), sem o seletor tipo relógio —
// vai inserindo os ":" sozinho à medida que se escrevem os dígitos.
function horaValida(h){ return /^([01]\d|2[0-3]):[0-5]\d$/.test(h); }
function ligarCampoHora(input){
  input.addEventListener('input', () => {
    const digitos = input.value.replace(/\D/g,'').slice(0,4);
    input.value = digitos.length > 2 ? `${digitos.slice(0,2)}:${digitos.slice(2)}` : digitos;
  });
}
ligarCampoHora(document.getElementById('horaIni'));
ligarCampoHora(document.getElementById('horaFim'));

// Fonte única de verdade: divide as entradas de um dia em horas normais/extra,
// usada na pré-visualização, nos registos guardados e na exportação Excel.
// Horas trabalhadas que ultrapassem 8h/dia (por ordem cronológica) contam como
// extra, somando-se às extras escritas à mão em cada entrada.
function distribuirNormaisExtras(entriesDoDia){
  const ordenadas = [...entriesDoDia].sort((a,b) => a.horaIni.localeCompare(b.horaIni));
  let acumulado = 0;
  const resultado = new Map(); // entrada -> {normal, extra}
  ordenadas.forEach(e => {
    const trabalhadas = horasEntre(e.horaIni, e.horaFim);
    const disponivelNormal = Math.max(0, 8 - acumulado);
    const normal = Math.min(trabalhadas, disponivelNormal);
    const extra = (trabalhadas - normal) + Number(e.extras || 0);
    acumulado += trabalhadas;
    resultado.set(e, { normal, extra });
  });
  return resultado;
}

function getDailyTotals(){
  const porDia = new Map(); // data -> [entradas]
  entries.forEach(e => {
    if(!porDia.has(e.data)) porDia.set(e.data, []);
    porDia.get(e.data).push(e);
  });
  const map = new Map(); // data -> {normal, extras, servicos:[]}
  porDia.forEach((lista, data) => {
    const dist = distribuirNormaisExtras(lista);
    let normal = 0, extras = 0;
    lista.forEach(e => { const v = dist.get(e); normal += v.normal; extras += v.extra; });
    map.set(data, { normal, extras, servicos: lista });
  });
  return map;
}

const DIAS_SEMANA = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function renderDailySummary(){
  const wrap = document.getElementById('dailySummary');
  const map = getDailyTotals();
  if(map.size === 0){
    wrap.innerHTML = `<div class="empty-list">Sem dias preenchidos ainda</div>`;
    return;
  }
  const dates = [...map.keys()].sort();
  wrap.innerHTML = dates.map(dt => {
    const info = map.get(dt);
    const falta = 8 - info.normal;
    const isOk = falta <= 0.01;
    const dname = DIAS_SEMANA[new Date(dt+'T00:00:00').getDay()];
    return `<div class="day-card ${isOk?'ok':'warn'}">
      <div class="top">
        <span class="dname">${dname} · <span class="mono">${dt}</span></span>
        <span class="badge ${isOk?'ok':'warn'}">${isOk ? '✓ 8h completas' : `⚠ faltam ${falta.toFixed(1)}h`}</span>
      </div>
      <div style="font-size:12px; color:var(--text-mute); margin-bottom:4px;">${info.normal.toFixed(1)}h normais${info.extras>0?` + ${info.extras.toFixed(1)}h extra`:''}</div>
      <ul>${info.servicos.map(s=>`<li>${esc(s.servico)} — ${s.horaIni}–${s.horaFim} · ${esc(s.local)}</li>`).join('')}</ul>
    </div>`;
  }).join('');
}

function diasIncompletos(){
  const map = getDailyTotals();
  const incompletos = [];
  map.forEach((info, dt) => { if(info.normal < 7.99) incompletos.push({dt, falta: 8-info.normal}); });
  return incompletos;
}

function confirmarSeIncompleto(){
  const incompletos = diasIncompletos();
  if(incompletos.length === 0) return true;
  const lista = incompletos.map(i => `• ${i.dt}: faltam ${i.falta.toFixed(1)}h`).join('\n');
  return confirm(`Atenção — há dias com menos de 8h registadas:\n\n${lista}\n\nContinuar mesmo assim?`);
}

function renderEntries(){
  const wrap = document.getElementById('entriesList');
  if(entries.length === 0){
    wrap.innerHTML = `<div class="empty-list">Ainda sem serviços adicionados esta semana</div>`;
    renderDailySummary();
    return;
  }
  wrap.innerHTML = entries.map((e,i) => `
    <div class="entry ${e.tipo}">
      <div class="top"><span class="serv">${esc(e.servico)}</span><span class="meta mono">${e.data}</span></div>
      <div class="meta">${e.horaIni}–${e.horaFim}${Number(e.extras)>0 ? ` · +${e.extras}h extra` : ''} ${e.local ? ' · '+esc(e.local) : ''}${e.equipamento ? ' · '+esc(e.equipamento) : ''}</div>
      ${e.obs ? `<div class="obs">${esc(e.obs)}</div>` : ''}
      <div class="actions">
        <button class="del" data-i="${i}">✕</button>
        <button class="edit" data-i="${i}">✏</button>
      </div>
    </div>
  `).join('');
  wrap.querySelectorAll('.del').forEach(btn => btn.addEventListener('click', () => {
    entries.splice(Number(btn.dataset.i),1);
    renderEntries();
    autoSaveDraft();
  }));
  wrap.querySelectorAll('.edit').forEach(btn => btn.addEventListener('click', () => {
    editarEntrada(Number(btn.dataset.i));
  }));
  renderDailySummary();
}
renderEntries();

function editarEntrada(i){
  const e = entries[i];
  entries.splice(i,1);
  renderEntries();

  setTipo(e.tipo); // repõe a lista de serviços certa (Com/Sem folha) antes de escolher o valor
  document.getElementById('data').value = e.data;
  document.getElementById('horaIni').value = e.horaIni;
  document.getElementById('horaFim').value = e.horaFim;
  document.getElementById('extras').value = e.extras;
  document.getElementById('obs').value = e.obs;

  document.getElementById('servico').value = e.servico;
  document.getElementById('servicoPickerBtn').textContent = e.servico;
  toggleEquipamento();
  document.getElementById('local').value = e.local;
  document.getElementById('localPickerBtn').textContent = e.local;

  if(e.equipamento){
    document.getElementById('equipItem').value = e.equipamento;
    document.getElementById('equipPickerBtn').textContent = e.equipamento;
  }
  showToast('A editar — corrige e toca em "Adicionar à lista"');
}

function showConfirmModal(message, onConfirm){
  const overlay = document.getElementById('confirmModal');
  document.getElementById('confirmModalMsg').textContent = message;
  overlay.style.display = 'flex';
  const btnYes = document.getElementById('confirmModalYes');
  const btnNo = document.getElementById('confirmModalNo');
  const cleanup = () => { overlay.style.display = 'none'; btnYes.onclick = null; btnNo.onclick = null; };
  btnYes.onclick = () => { cleanup(); onConfirm(); };
  btnNo.onclick = cleanup;
}

document.getElementById('btnSend').addEventListener('click', () => {
  const nome = document.getElementById('nome').value;
  const semana = document.getElementById('semana').value;
  if(!nome){ showToast('Seleciona o colaborador'); return; }
  if(!semana){ showToast('Indica a semana'); return; }
  if(entries.length === 0){ showToast('Adiciona pelo menos um serviço'); return; }

  const incompletos = diasIncompletos();
  if(incompletos.length > 0){
    const lista = incompletos.map(i => `• ${i.dt}: faltam ${i.falta.toFixed(1)}h`).join('\n');
    showConfirmModal(`Atenção — há dias com menos de 8h registadas:\n\n${lista}\n\nContinuar mesmo assim?`, enviarFolha);
    return;
  }
  enviarFolha();
});

async function enviarFolha(){
  const nome = document.getElementById('nome').value;
  const semana = document.getElementById('semana').value;

  const porDia = new Map();
  entries.forEach(e => {
    if(!porDia.has(e.data)) porDia.set(e.data, []);
    porDia.get(e.data).push(e);
  });
  const distribuicao = new Map();
  porDia.forEach(lista => { distribuirNormaisExtras(lista).forEach((v,k) => distribuicao.set(k, v)); });

  const DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const rows = entries.map(e => {
    const d = new Date(e.data + 'T00:00:00');
    const { normal, extra } = distribuicao.get(e);
    return {
      'Nome': nome,
      'Semana': semana,
      'Data': e.data,
      'Dia': DIAS[d.getDay()],
      'Tipo': e.tipo === 'com' ? 'Com folha' : 'Sem folha',
      'Serviço': e.servico,
      'Local': e.local,
      'Equipamento': e.equipamento || '',
      'Das': e.horaIni,
      'Às': e.horaFim,
      'Horas Normais': Math.round(normal*100)/100,
      'Horas Extra': Math.round(extra*100)/100,
      'Total Horas': Math.round((normal+extra)*100)/100,
      'Obs.': e.obs
    };
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:14},{wch:10},{wch:11},{wch:9},{wch:10},{wch:20},{wch:16},{wch:22},{wch:7},{wch:7},{wch:12},{wch:10},{wch:11},{wch:24}];
  const lastCol = XLSX.utils.encode_col(rows.length ? Object.keys(rows[0]).length - 1 : 11);
  ws['!autofilter'] = { ref: `A1:${lastCol}${rows.length + 1}` };
  const wb = XLSX.utils.book_new();
  const tabName = nome.slice(0,31).replace(/[\\/?*\[\]:]/g,'');
  XLSX.utils.book_append_sheet(wb, ws, tabName);

  const filename = `Folha_Servico_${nome.replace(/\s+/g,'_')}_${semana}.xlsx`;
  const wbArray = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([wbArray], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const file = new File([blob], filename, {type: blob.type});

  // O Android (Chrome/Samsung Internet) só permite partilhar ficheiros de tipos
  // específicos via navigator.share() — Excel/.xlsx não está nessa lista, mas
  // .csv está (é tratado como texto). Gera-se por isso uma versão CSV como
  // segunda tentativa, para o Android conseguir sempre partilhar algo.
  const csvFilename = `Folha_Servico_${nome.replace(/\s+/g,'_')}_${semana}.csv`;
  const csvHeaders = rows.length ? Object.keys(rows[0]) : [];
  // Formato português: ";" a separar colunas, "," a separar casas decimais —
  // assim o Excel reconhece os números como números, não como texto.
  const csvValor = v => {
    if(typeof v === 'number') return String(v).replace('.', ',');
    const s = String(v ?? '');
    return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  };
  const csvConteudo = '﻿' + [csvHeaders.join(';'), ...rows.map(r => csvHeaders.map(h => csvValor(r[h])).join(';'))].join('\r\n');
  const csvBlob = new Blob([csvConteudo], {type: 'text/csv'});
  const csvFile = new File([csvBlob], csvFilename, {type: 'text/csv'});

  // Tenta abrir logo o menu de partilha (WhatsApp incluído) — tem de ser a primeira coisa
  // a acontecer depois do toque no botão, senão o telemóvel deixa de reconhecer a ação
  // como iniciada pelo utilizador e recusa a partilha.
  async function tentarPartilhar(ficheiro, texto){
    if(!(navigator.share && navigator.canShare && navigator.canShare({files:[ficheiro]}))) return 'indisponivel';
    try{
      await navigator.share({ files:[ficheiro], title:ficheiro.name, text:texto });
      return 'enviado';
    }catch(err){
      return err.name === 'AbortError' ? 'cancelado' : 'falhou';
    }
  }

  // O telemóvel só reconhece UMA tentativa de partilha por toque — chamar
  // navigator.share() duas vezes seguidas (Excel, depois CSV) faz a segunda
  // falhar sempre, mesmo com um tipo de ficheiro aceite. Por isso escolhe-se
  // logo à partida qual tentar: no Android vai direto ao CSV (o Excel falha
  // sempre lá); nos restantes tenta o Excel primeiro (funciona no iPhone).
  const textoPartilha = `Folha de serviço — ${nome} — Semana ${semana}`;
  const isAndroid = /Android/i.test(navigator.userAgent);
  const ficheiroPreferido = isAndroid ? csvFile : file;
  const textoPreferido = isAndroid ? textoPartilha + ' (CSV — abre bem no Excel)' : textoPartilha;

  // O WhatsApp ignora sempre o texto que acompanha um ficheiro partilhado (não
  // aparece como legenda) — por isso copia-se para a área de transferência,
  // para o colaborador só ter de colar na legenda em vez de escrever à mão.
  try{ await navigator.clipboard.writeText(`${nome} — Semana ${semana}`); }catch(err){ /* sem acesso à área de transferência — segue sem copiar */ }

  let resultado = await tentarPartilhar(ficheiroPreferido, textoPreferido);
  if(resultado === 'enviado'){ showToast((isAndroid ? 'Folha enviada (CSV) ✓' : 'Folha enviada ✓') + ' — cola o texto copiado na legenda'); return; }
  if(resultado === 'cancelado'){ showToast('Envio cancelado'); return; }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  showToast('Ficheiro guardado em Transferências — abre o WhatsApp, anexa-o e cola o texto copiado na legenda');
}

document.getElementById('btnSave').addEventListener('click', async () => {
  const nome = document.getElementById('nome').value.trim();
  const semana = document.getElementById('semana').value;
  if(!nome){ showToast('Indica o teu nome'); return; }
  if(!semana){ showToast('Indica a semana'); return; }
  if(entries.length === 0){ showToast('Adiciona pelo menos um serviço'); return; }
  if(!confirmarSeIncompleto()) return;

  const key = `folha:${slugKey(semana)}:${slugKey(nome)}`;
  const payload = { nome, semana, entries, guardadoEm: new Date().toISOString() };
  try{
    const res = await storage.set(key, JSON.stringify(payload));
    if(!res){ showToast('Erro ao guardar (resposta vazia)'); return; }
    showToast('Folha guardada ✓');
  }catch(err){
    console.error('Erro ao guardar:', err);
    showToast('Erro: ' + (err && err.message ? err.message : String(err)));
  }
});

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const t = btn.dataset.tab;
    document.getElementById('tab-preencher').style.display = t==='preencher' ? 'block':'none';
    document.getElementById('tab-registos').style.display = t==='registos' ? 'block':'none';
    document.getElementById('footerBar').style.display = t==='preencher' ? 'flex':'none';
    if(t==='registos') loadSaved();
  });
});

async function loadSaved(){
  const wrap = document.getElementById('savedList');
  wrap.innerHTML = `<div class="empty-list">A carregar…</div>`;
  try{
    const list = await storage.list('folha:');
    const keys = (list && list.keys) || [];
    if(keys.length === 0){
      wrap.innerHTML = `<div class="empty-list">Ainda não há folhas guardadas</div>`;
      return;
    }
    const items = [];
    for(const k of keys){
      try{
        const r = await storage.get(k);
        if(r) items.push(JSON.parse(r.value));
      }catch(e){}
    }
    items.sort((a,b) => (b.semana||'').localeCompare(a.semana||''));
    wrap.innerHTML = items.map(it => {
      const porDia = new Map();
      it.entries.forEach(e => {
        if(!porDia.has(e.data)) porDia.set(e.data, []);
        porDia.get(e.data).push(e);
      });
      let normalTotal = 0, extraTotal = 0;
      porDia.forEach(lista => {
        distribuirNormaisExtras(lista).forEach(v => { normalTotal += v.normal; extraTotal += v.extra; });
      });
      return `<div class="saved-week">
        <div class="hd"><span>${esc(it.nome)}</span><span class="mono">Sem. ${esc(it.semana)}</span></div>
        <div class="stat">${it.entries.length} serviços · ${normalTotal.toFixed(1)}h normais${extraTotal>0?` + ${extraTotal.toFixed(1)}h extra`:''}</div>
      </div>`;
    }).join('');
  }catch(err){
    wrap.innerHTML = `<div class="empty-list">Não foi possível carregar os registos</div>`;
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 4000);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
